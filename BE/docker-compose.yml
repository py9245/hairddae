services:
  app:
    image: ${APP_IMAGE:-be-app:local}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_HAIR_STATIC_ROOT_PATH: /opt/be-static
      APP_HAIR_STATIC_BASE_URL: /static
      APP_INFERENCE_WS_BASE_URL: ${APP_INFERENCE_WS_BASE_URL:-/ws/inference/apply}
      APP_INFERENCE_RTC_OFFER_URL: ${APP_INFERENCE_RTC_OFFER_URL:-/rtc/inference/offer}
      APP_INFERENCE_RTC_ICE_SERVERS_JSON: ${APP_INFERENCE_RTC_ICE_SERVERS_JSON:-[]}
      APP_INFERENCE_WS_AUTH_TRANSPORT: ${APP_INFERENCE_WS_AUTH_TRANSPORT:-sec-websocket-protocol.v1}
      APP_INFERENCE_NODE_ID: ${APP_INFERENCE_NODE_ID:-infer-a-01}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../static:/opt/be-static
    expose:
      - "8080"
    networks:
      - app-net

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      INFERENCE_UPSTREAM_HOST: ${INFERENCE_UPSTREAM_HOST:-15.164.169.221}
      INFERENCE_UPSTREAM_PORT: ${INFERENCE_UPSTREAM_PORT:-8090}
      APP_PUBLIC_PRIMARY_HOST: ${APP_PUBLIC_PRIMARY_HOST:-j14m101.p.ssafy.io}
      APP_PUBLIC_SECONDARY_HOST: ${APP_PUBLIC_SECONDARY_HOST:-hairddae.store}
      APP_PUBLIC_CERT_NAME: ${APP_PUBLIC_CERT_NAME:-j14m101.p.ssafy.io}
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/html:/usr/share/nginx/html:ro
      - ../static:/srv/static:ro
      - ./nginx/certs:/etc/letsencrypt:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-net

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beapp -d beapp"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file:
      - .env
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "PING"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-net

volumes:
  postgres-data:

networks:
  app-net:
