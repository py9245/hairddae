services:
  app:
    image: ${APP_IMAGE:-be-app:local}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_HAIR_STATIC_ROOT_PATH: /opt/be-static
      APP_HAIR_STATIC_BASE_URL: /static
      APP_INFERENCE_WS_BASE_URL: ${APP_INFERENCE_WS_BASE_URL:-wss://j14m101.p.ssafy.io/ws/inference/apply}
      APP_INFERENCE_RTC_OFFER_URL: ${APP_INFERENCE_RTC_OFFER_URL:-https://j14m101.p.ssafy.io/rtc/inference/offer}
      APP_INFERENCE_RTC_ICE_SERVERS_JSON: ${APP_INFERENCE_RTC_ICE_SERVERS_JSON:-[]}
      APP_INFERENCE_WS_AUTH_TRANSPORT: ${APP_INFERENCE_WS_AUTH_TRANSPORT:-sec-websocket-protocol.v1}
      APP_INFERENCE_NODE_ID: ${APP_INFERENCE_NODE_ID:-infer-a-01}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../static:/opt/be-static:ro
    expose:
      - "8080"
    networks:
      - app-net

  inference:
    image: ${INFERENCE_IMAGE:-inference-app:local}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      INFERENCE_STATIC_ROOT: /opt/be-static
      INFERENCE_STATIC_BASE_URL: /static
      INFERENCE_JWT_SECRET: ${APP_SECURITY_JWT_SECRET:-hairddae-local-jwt-secret-key-for-dev-only-2026}
      INFERENCE_JWT_ISSUER: ${APP_SECURITY_JWT_ISSUER:-hairddae}
      INFERENCE_NODE_ID: ${APP_INFERENCE_NODE_ID:-infer-a-01}
      INFERENCE_RTC_ICE_SERVERS_JSON: ${APP_INFERENCE_RTC_ICE_SERVERS_JSON:-[]}
      INFERENCE_HYSTERESIS_MARGIN: ${INFERENCE_HYSTERESIS_MARGIN:-4.0}
      INFERENCE_MIN_HOLD_MS: ${INFERENCE_MIN_HOLD_MS:-400}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ../static:/opt/be-static:ro
    expose:
      - "8090"
    networks:
      - app-net

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - app
      - inference
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
      - ../static:/srv/static:ro
      - ./nginx/certs:/etc/letsencrypt:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-net

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beapp -d beapp"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file:
      - .env
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "PING"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-net

volumes:
  postgres-data:

networks:
  app-net:
