upstream backend {
    server app:8080;
}

upstream inference {
    server ${INFERENCE_UPSTREAM_HOST}:${INFERENCE_UPSTREAM_PORT};
}

upstream jenkins {
    server host.docker.internal:8080;
}

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=chat_poll_limit:10m rate=30r/s;

server {
    listen 80;
    server_name ${APP_PUBLIC_PRIMARY_HOST} ${APP_PUBLIC_SECONDARY_HOST};
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ${APP_PUBLIC_PRIMARY_HOST} ${APP_PUBLIC_SECONDARY_HOST};

    ssl_certificate /etc/letsencrypt/live/${APP_PUBLIC_CERT_NAME}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${APP_PUBLIC_CERT_NAME}/privkey.pem;

    client_max_body_size 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://accounts.google.com/gsi/client https://t1.kakaocdn.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://accounts.google.com/gsi/style; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' blob: data: https:; frame-src 'self' https://accounts.google.com/gsi/ https://postcode.map.daum.net https://*.daum.net https://*.kakao.com; worker-src 'self' blob:; connect-src 'self' https: wss: stun: turn: https://accounts.google.com/gsi/; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    root /usr/share/nginx/html;
    index index.html;

    location ~* ^/static/.*\.json$ {
        root /srv;
        add_header Cache-Control "public, max-age=60";
    }

    location /static/ {
        alias /srv/static/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # avoid rewrite loop / missing favicon
    location ^~ /favicon.ico {
        log_not_found off;
        access_log off;
        try_files /favicon.ico =204;
    }

    location = /jenkins {
        return 301 /jenkins/;
    }

    location /jenkins/ {
        proxy_pass http://jenkins;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /jenkins;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location ^~ /ws/inference/ {
        proxy_pass http://inference/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ^~ /rtc/inference/ {
        proxy_pass http://inference/rtc/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ~ ^/api/chat/rooms/[0-9]+/messages/?$ {
        limit_req zone=chat_poll_limit burst=60 nodelay;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /actuator/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Host $host;
    }

    # legacy swagger/openapi paths -> /api/*
    location = /swagger-ui {
        return 301 /api/swagger-ui.html;
    }

    location = /swagger-ui/ {
        return 301 /api/swagger-ui.html;
    }

    location = /swagger-ui/index.html {
        return 301 /api/swagger-ui.html;
    }

    location = /v3/api-docs {
        return 301 /api/v3/api-docs;
    }

    location = /v3/api-docs/ {
        return 301 /api/v3/api-docs;
    }

    location /v3/api-docs/ {
        return 301 /api/v3/api-docs;
    }
}
