spring:
  application:
    name: be-app
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: ${REDIS_TIMEOUT:2000}
  security:
    user:
      name: ${APP_SECURITY_USER:admin}
      password: ${APP_SECURITY_PASSWORD:admin_pw}

server:
  port: ${SERVER_PORT:8080}
  address: 0.0.0.0
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      enabled: true
    db:
      enabled: true

logging:
  level:
    org.springframework.security: INFO

app:
  hair:
    static-root-path: ${APP_HAIR_STATIC_ROOT_PATH:/opt/be-static}
    static-base-url: ${APP_HAIR_STATIC_BASE_URL:/static}
  camera-ai:
    enabled: ${APP_CAMERA_AI_ENABLED:true}
    provider-base-url: ${GMS_BASE_URL:}
    provider-auth-token: ${GMS_KEY:}
    model-name: ${GMS_IMAGE_MODEL:gpt-image-1-mini}
    request-timeout-ms: ${APP_CAMERA_AI_REQUEST_TIMEOUT_MS:30000}
    max-upload-size-bytes: ${APP_CAMERA_AI_MAX_UPLOAD_SIZE_BYTES:5242880}
    result-dir: ${APP_CAMERA_AI_RESULT_DIR:camera-ai}
    size: ${APP_CAMERA_AI_SIZE:1024x1024}
    quality: ${APP_CAMERA_AI_QUALITY:low}
    output-format: ${APP_CAMERA_AI_OUTPUT_FORMAT:png}
    input-fidelity: ${APP_CAMERA_AI_INPUT_FIDELITY:}
  inference:
    ws-base-url: ${APP_INFERENCE_WS_BASE_URL:/ws/inference/apply}
    rtc-offer-url: ${APP_INFERENCE_RTC_OFFER_URL:/rtc/inference/offer}
    rtc-ice-servers-json: ${APP_INFERENCE_RTC_ICE_SERVERS_JSON:[]}
    metadata-sync-secret: ${APP_INFERENCE_METADATA_SYNC_SECRET:}
    ws-auth-transport: ${APP_INFERENCE_WS_AUTH_TRANSPORT:sec-websocket-protocol.v1}
    audience: ${APP_INFERENCE_AUDIENCE:inference}
    node-id: ${APP_INFERENCE_NODE_ID:infer-gpu-01}
    connect-ticket-expiry-seconds: ${APP_INFERENCE_CONNECT_TICKET_EXPIRY_SECONDS:30}
    processed-timeout-ms: ${APP_INFERENCE_PROCESSED_TIMEOUT_MS:250}
    heartbeat-interval-ms: ${APP_INFERENCE_HEARTBEAT_INTERVAL_MS:5000}
    idle-ttl-ms: ${APP_INFERENCE_IDLE_TTL_MS:30000}
    feature-schema-version: ${APP_INFERENCE_FEATURE_SCHEMA_VERSION:2}
    asset-bundle-schema-version: ${APP_INFERENCE_ASSET_BUNDLE_SCHEMA_VERSION:1}
    transform-version: ${APP_INFERENCE_TRANSFORM_VERSION:affine_v1}
  security:
    cors:
      allowed-origins: ${APP_SECURITY_CORS_ALLOWED_ORIGINS:https://j14m101.p.ssafy.io,https://hairddae.store,https://localhost,https://127.0.0.1,https://localhost:8443,https://127.0.0.1:8443,http://localhost,http://127.0.0.1,http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}
    google:
      client-id: ${APP_SECURITY_GOOGLE_CLIENT_ID:}
      jwk-set-uri: ${APP_SECURITY_GOOGLE_JWK_SET_URI:https://www.googleapis.com/oauth2/v3/certs}
    jwt:
      secret: ${APP_SECURITY_JWT_SECRET:hairddae-local-jwt-secret-key-for-dev-only-2026}
      access-token-expiry-minutes: ${APP_SECURITY_JWT_ACCESS_MINUTES:60}
      refresh-token-expiry-days: ${APP_SECURITY_JWT_REFRESH_DAYS:1}
      issuer: ${APP_SECURITY_JWT_ISSUER:hairddae}

springdoc:
  api-docs:
    path: /api/v3/api-docs
  swagger-ui:
    path: /api/swagger-ui.html
