spring:
  application:
    name: be-app
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: ${REDIS_TIMEOUT:2000}
  security:
    user:
      name: ${APP_SECURITY_USER:admin}
      password: ${APP_SECURITY_PASSWORD:admin_pw}

server:
  port: ${SERVER_PORT:8080}
  address: 0.0.0.0
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      enabled: true
    db:
      enabled: true

logging:
  level:
    org.springframework.security: INFO

app:
  security:
    jwt:
      secret: ${APP_SECURITY_JWT_SECRET:hairddae-local-jwt-secret-key-for-dev-only-2026}
      access-token-expiry-minutes: ${APP_SECURITY_JWT_ACCESS_MINUTES:60}
      refresh-token-expiry-days: ${APP_SECURITY_JWT_REFRESH_DAYS:14}
      issuer: ${APP_SECURITY_JWT_ISSUER:hairddae}

springdoc:
  api-docs:
    path: /api/v3/api-docs
  swagger-ui:
    path: /api/swagger-ui.html
