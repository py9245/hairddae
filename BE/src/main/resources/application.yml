spring:
  application:
    name: be-app
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: ${REDIS_TIMEOUT:2000}
  security:
    user:
      name: ${APP_SECURITY_USER:admin}
      password: ${APP_SECURITY_PASSWORD:admin_pw}

server:
  port: ${SERVER_PORT:8080}
  address: 0.0.0.0
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      enabled: true
    db:
      enabled: true

logging:
  level:
    org.springframework.security: INFO

app:
  hair:
    static-root-path: ${APP_HAIR_STATIC_ROOT_PATH:/opt/be-static}
    static-base-url: ${APP_HAIR_STATIC_BASE_URL:/static}
  inference:
    ws-base-url: ${APP_INFERENCE_WS_BASE_URL:wss://j14m101.p.ssafy.io/ws/inference/apply}
    rtc-offer-url: ${APP_INFERENCE_RTC_OFFER_URL:https://j14m101.p.ssafy.io/rtc/inference/offer}
    rtc-ice-servers-json: ${APP_INFERENCE_RTC_ICE_SERVERS_JSON:[]}
    ws-auth-transport: ${APP_INFERENCE_WS_AUTH_TRANSPORT:sec-websocket-protocol.v1}
    ws-protocol: ${APP_INFERENCE_WS_PROTOCOL:hairapply.v2}
    audience: ${APP_INFERENCE_AUDIENCE:inference}
    node-id: ${APP_INFERENCE_NODE_ID:infer-a-01}
    connect-ticket-expiry-seconds: ${APP_INFERENCE_CONNECT_TICKET_EXPIRY_SECONDS:30}
    processed-timeout-ms: ${APP_INFERENCE_PROCESSED_TIMEOUT_MS:250}
    heartbeat-interval-ms: ${APP_INFERENCE_HEARTBEAT_INTERVAL_MS:5000}
    idle-ttl-ms: ${APP_INFERENCE_IDLE_TTL_MS:30000}
    feature-schema-version: ${APP_INFERENCE_FEATURE_SCHEMA_VERSION:2}
    asset-bundle-schema-version: ${APP_INFERENCE_ASSET_BUNDLE_SCHEMA_VERSION:1}
    transform-version: ${APP_INFERENCE_TRANSFORM_VERSION:affine_v1}
  security:
    cors:
      allowed-origins: ${APP_SECURITY_CORS_ALLOWED_ORIGINS:https://j14m101.p.ssafy.io,https://localhost,https://127.0.0.1,https://localhost:8443,https://127.0.0.1:8443,http://localhost,http://127.0.0.1,http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}
    jwt:
      secret: ${APP_SECURITY_JWT_SECRET:hairddae-local-jwt-secret-key-for-dev-only-2026}
      access-token-expiry-minutes: ${APP_SECURITY_JWT_ACCESS_MINUTES:60}
      refresh-token-expiry-days: ${APP_SECURITY_JWT_REFRESH_DAYS:14}
      issuer: ${APP_SECURITY_JWT_ISSUER:hairddae}

springdoc:
  api-docs:
    path: /api/v3/api-docs
  swagger-ui:
    path: /api/swagger-ui.html
