spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  datasource:
    url: jdbc:h2:mem:historydb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  security:
    user:
      name: test-admin
      password: test-admin-password

management:
  health:
    redis:
      enabled: false
    db:
      enabled: false

app:
  inference:
    metadata-sync-secret: test-inference-sync-secret
  security:
    jwt:
      secret: hairddae-history-test-jwt-secret-key-for-local-tests-2026
      access-token-expiry-minutes: 30
      refresh-token-expiry-days: 7
      issuer: hairddae-history-test
