# /etc/nginx/sites-available/hairddae.store
# 초기(증명서 없음) 구성: 80 포트로만 서비스 + ACME 챌린지 허용
# certbot --nginx 실행 후 HTTPS 리다이렉트/SSL 설정이 자동으로 추가됩니다.

server {
    listen 80;
    listen [::]:80;
    server_name hairddae.store www.hairddae.store;

    root /var/www/hairddae/current;
    index index.html;

    # ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/hairddae/current;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets: long cache
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }
}
