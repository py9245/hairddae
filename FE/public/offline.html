<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ea7589" />
    <title>헤어때 | 오프라인</title>
    <style>
      :root {
        color-scheme: light;
        --brand: #ea7589;
        --brand-soft: #fff1f4;
        --text-main: #4f4040;
        --text-sub: #7a6a6a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at top, rgba(234, 117, 137, 0.18), transparent 38%),
          linear-gradient(180deg, #fffafb 0%, #fff4f6 100%);
        color: var(--text-main);
        font-family:
          Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

      main {
        width: min(100%, 440px);
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 22px 80px rgba(79, 64, 64, 0.14);
        padding: 28px 24px;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        border-radius: 999px;
        background: var(--brand-soft);
        color: var(--brand);
        padding: 8px 12px;
        font-size: 12px;
        font-weight: 700;
      }

      h1 {
        margin: 16px 0 10px;
        font-size: 28px;
      }

      p {
        margin: 0;
        line-height: 1.6;
        color: var(--text-sub);
      }

      a {
        display: inline-flex;
        margin-top: 20px;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        background: var(--brand);
        color: white;
        padding: 12px 18px;
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="badge">오프라인 모드</div>
      <h1>네트워크 연결을 확인해 주세요</h1>
      <p>
        헤어때의 기본 앱 셸은 열 수 있지만, 카메라 체험과 실시간 추천은
        네트워크 연결이 필요합니다. 연결이 복구되면 다시 시도해 주세요.
      </p>
      <a href="/">홈으로 돌아가기</a>
    </main>
  </body>
</html>
