services:
  inference:
    image: ${INFERENCE_RUNTIME_IMAGE:-inference-app:rtc-debug-20260324-003326}
    container_name: inference-server
    restart: unless-stopped
    working_dir: /app
    env_file:
      - .env.server
    environment:
      INFERENCE_HOST: 0.0.0.0
      INFERENCE_PORT: 8090
      INFERENCE_ASSET_ROOT: /srv/static
      INFERENCE_FACE_LANDMARKER_MODEL_PATH: /app/models/face_landmarker.task
      INFERENCE_HAIR_SEGMENTER_MODEL_PATH: /app/models/mediapipe/hair_segmenter.tflite
      INFERENCE_RTC_DEBUG_DUMP_DIR: /tmp/rtc-debug
      INFERENCE_RTC_LIGHTWEIGHT_OVERLAY_ONLY: "1"
      INFERENCE_RTC_LIGHTWEIGHT_RENDERER_NAME: mesh_v2
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility,video}
    command:
      - /app/.venv/bin/python
      - -m
      - uvicorn
      - app.main:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8090"
    gpus: all
    network_mode: host
    volumes:
      - .:/app
      - inference_venv:/app/.venv
      - ../static:/srv/static:ro

volumes:
  inference_venv:
