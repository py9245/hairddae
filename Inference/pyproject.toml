[project]
name = "hairapply-inference"
version = "0.1.0"
description = "Feature-only websocket inference service for hair apply"
requires-python = ">=3.10"
dependencies = [
  "aiortc>=1.9,<2.0",
  "fastapi>=0.115,<1.0",
  "mediapipe==0.10.20",
  "numpy>=1.26,<2.0",
  "opencv-python-headless>=4.10,<5.0",
  "Pillow>=10.4,<12.0",
  "PyJWT>=2.10,<3.0",
  "redis>=5.2,<6.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
